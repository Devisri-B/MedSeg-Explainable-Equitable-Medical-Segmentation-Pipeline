data:
  name: pannuke
  root: data/pannuke
  image_size: 256
  num_classes: 6
  class_names:
  - Background
  - Neoplastic
  - Inflammatory
  - Connective
  - Dead
  - Epithelial
  train_folds:
  - 1
  - 3
  test_fold: 2
  val_fraction: 0.15
  batch_size: 8
  num_workers: 0
  augment: true
  stain_aug: true
  limit: 0
model:
  arch: unet
  encoder: resnet18
  encoder_weights: imagenet
  pretrained: true
train:
  epochs: 4
  lr: 0.0003
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  ce_weight: 1.0
  dice_weight: 1.0
  include_background_in_dice: false
  seg_loss: focal_tversky
  tversky_alpha: 0.3
  tversky_beta: 0.7
  focal_gamma: 1.3333
  class_weight_scheme: sqrt
  class_weight_clip: 10.0
  select_metric: mean_dice_robust
  robust_exclude:
  - Dead
  seed: 42
  device: auto
  amp: false
  grad_clip: 0.0
  early_stop_patience: 5
  val_interval: 1
  output_dir: outputs
  run_name: pannuke_unet_r18_fold2
